<!DOCTYPE html>

<body>
O metodo get envia os dados pelo endereço
    <form method="get" action="/cadastro">
        <input type="text" name="email">
        <input type="text" name="nome">
        <input type="submit">
    </form>
    Caso o action seja um site específico deve-se colocar o http://

    O method POST envia para o backend as informações
    <br><br>
    O method get é importante quando se faz uma requisição a algum site como exemplo:

    <form method="post" action="https://www.youtube.com/results">
        <input type="text" name="search_query">
        <input type="submit">
    </form>
</body>
</html>
